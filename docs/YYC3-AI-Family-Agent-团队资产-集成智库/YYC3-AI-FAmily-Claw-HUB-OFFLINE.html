##### dispose()\n\n清理资源。\n\n```typescript\nmanager.dispose()\n```\n\n---\n\n### BaseAgent\n\n智能体基类。\n\n#### 属性\n\n```typescript\nagent.getId()      // 获取智能体ID\nagent.getName()    // 获取智能体名称\nagent.getState()   // 获取智能体状态\nagent.getStats()   // 获取统计信息\n```\n\n#### 方法\n\n##### canAcceptTask()\n\n是否可以接受新任务。\n\n```typescript\nif (agent.canAcceptTask()) {\n  // 可以分配任务\n}\n```\n\n##### execute(task)\n\n执行任务。\n\n```typescript\nconst result = await agent.execute(task)\n```\n\n---\n\n## 技能系统 (Skills)\n\n### SkillManager\n\n技能管理器。\n\n#### 构造函数\n\n```typescript\nimport { SkillManager } from '@claw-ai/core/skills'\n\nconst manager = new SkillManager({\n  maxConcurrent: 5,\n  timeout: 60000\n})\n```\n\n#### 方法\n\n##### register(definition, handler)\n\n注册技能。\n\n```typescript\nmanager.register(\n  {\n    id: 'custom.skill',\n    name: '自定义技能',\n    description: '技能描述',\n    version: '1.0.0',\n    category: 'custom'\n  },\n  async (input, context) => {\n    return {\n      success: true,\n      output: { result: 'done' },\n      duration: 100\n    }\n  }\n)\n```\n\n##### unregister(skillId)\n\n注销技能。\n\n```typescript\nmanager.unregister('custom.skill')\n```\n\n##### get(skillId)\n\n获取技能。\n\n```typescript\nconst skill = manager.get('custom.skill')\n```\n\n##### getAll()\n\n获取所有技能。\n\n```typescript\nconst skills = manager.getAll()\n// 返回: SkillRegistryItem[]\n```\n\n##### execute(skillId, input, context)\n\n执行技能。\n\n```typescript\nconst result = await manager.execute('custom.skill', { data: 'test' }, {\n  sessionId: 'session-123'\n})\n```\n\n##### recommend(task)\n\n推荐技能。\n\n```typescript\nconst recommendations = manager.recommend('代码审查')\n```\n\n##### getByCategory(category)\n\n按类别获取技能。\n\n```typescript\nconst analysisSkills = manager.getByCategory('analysis')\n```\n\n---\n\n### 内置技能\n\n#### ReasoningSkill (CAGEERF 推理框架)\n\n```typescript\nimport { ReasoningSkill, reasoningHandler } from '@claw-ai/core/skills'\n\nmanager.register(ReasoningSkill, reasoningHandler)\n```\n\n#### GenerationSkill (内容生成器)\n\n```typescript\nimport { GenerationSkill, generationHandler } from '@claw-ai/core/skills'\n\nmanager.register(GenerationSkill, generationHandler)\n```\n\n#### AnalysisSkill (代码分析器)\n\n```typescript\nimport { AnalysisSkill, analysisHandler } from '@claw-ai/core/skills'\n\nmanager.register(AnalysisSkill, analysisHandler)\n```\n\n---\n\n## MCP 协议\n\n### MCPClient\n\nMCP 协议客户端。\n\n#### 构造函数\n\n```typescript\nimport { MCPClient } from '@claw-ai/core/mcp'\n\nconst client = new MCPClient({\n  transport: myTransport,\n  name: 'my-client',\n  version: '1.0.0',\n  capabilities: {\n    tools: true,\n    resources: true,\n    prompts: false\n  }\n})\n```\n\n#### 方法\n\n##### connect()\n\n连接到 MCP 服务器。\n\n```typescript\nawait client.connect()\n```\n\n##### close()\n\n关闭连接。\n\n```typescript\nawait client.close()\n```\n\n##### callTool(name, args)\n\n调用工具。\n\n```typescript\nconst result = await client.callTool('read_file', { path: '/test.txt' })\n```\n\n##### readResource(uri)\n\n读取资源。\n\n```typescript\nconst content = await client.readResource('file:///test.txt')\n```\n\n#### 属性\n\n```typescript\nclient.connected    // 连接状态\nclient.tools        // 工具列表\nclient.resources    // 资源列表\nclient.capabilities // 服务器能力\n```\n\n---\n\n## 多模态处理 (Multimodal)\n\n### MultimodalManager\n\n多模态管理器。\n\n#### 构造函数\n\n```typescript\nimport { MultimodalManager } from '@claw-ai/core/multimodal'\n\nconst manager = new MultimodalManager(authManager)\n```\n\n#### 方法\n\n##### getImageProcessor()\n\n获取图像处理器。\n\n```typescript\nconst imageProcessor = manager.getImageProcessor()\n```\n\n##### getAudioProcessor()\n\n获取音频处理器。\n\n```typescript\nconst audioProcessor = manager.getAudioProcessor()\n```\n\n##### getDocumentProcessor()\n\n获取文档处理器。\n\n```typescript\nconst docProcessor = manager.getDocumentProcessor()\n```\n\n---\n\n### ImageProcessor\n\n图像处理器。\n\n#### analyze(image, options?)\n\n分析图像。\n\n```typescript\nconst result = await imageProcessor.analyze(\n  {\n    type: 'image',\n    format: 'png',\n    data: imageBuffer\n  },\n  {\n    tasks: ['describe', 'ocr', 'classify'],\n    detail: 'high'\n  }\n)\n```\n\n**分析任务:**\n- `'describe'` - 描述图像内容\n- `'ocr'` - 文字识别\n- `'classify'` - 分类\n- `'detect'` - 目标检测\n- `'caption'` - 生成标题\n\n#### analyzeBatch(images, options?)\n\n批量分析图像。\n\n```typescript\nconst results = await imageProcessor.analyzeBatch([img1, img2])\n```\n\n---\n\n### AudioProcessor\n\n音频处理器。\n\n#### transcribe(audio, options?)\n\n转录音频。\n\n```typescript\nconst result = await audioProcessor.transcribe(\n  {\n    type: 'audio',\n    format: 'mp3',\n    data: audioBuffer\n  },\n  {\n    language: 'zh',\n    model: 'whisper-1'\n  }\n)\n```\n\n#### synthesize(text, options?)\n\n语音合成。\n\n```typescript\nconst result = await audioProcessor.synthesize('你好世界', {\n  voice: 'alloy',\n  speed: 1.0\n})\n```\n\n---\n\n### DocumentProcessor\n\n文档处理器。\n\n#### parse(document, options?)\n\n解析文档。\n\n```typescript\nconst result = await docProcessor.parse(\n  {\n    type: 'document',\n    format: 'pdf',\n    data: docBuffer\n  },\n  {\n    extractText: true,\n    extractMetadata: true\n  }\n)\n```\n\n#### summarize(document, maxLength?)\n\n摘要文档。\n\n```typescript\nconst summary = await docProcessor.summarize(document, 500)\n```\n\n#### extractKeyInfo(document, keys)\n\n提取关键信息。\n\n```typescript\nconst info = await docProcessor.extractKeyInfo(document, ['标题', '作者', '日期'])\n```\n\n#### compare(doc1, doc2)\n\n对比文档。\n\n```typescript\nconst diff = await docProcessor.compare(doc1, doc2)\n// 返回: { similarities, differences, summary }\n```\n\n---\n\n## 类型定义\n\n### ChatMessage\n\n```typescript\ninterface ChatMessage {\n  role: 'system' | 'user' | 'assistant' | 'tool'\n  content: string\n  name?: string\n}\n```\n\n### AgentRole\n\n```typescript\ntype AgentRole =\n  | 'meta-oracle'\n  | 'sentinel'\n  | 'master'\n  | 'creative'\n  | 'navigator'\n  | 'thinker'\n  | 'prophet'\n  | 'bolero'\n```\n\n### TaskPriority\n\n```typescript\ntype TaskPriority = 'low' | 'medium' | 'high' | 'critical'\n```\n\n### SkillCategory\n\n```typescript\ntype SkillCategory =\n  | 'reasoning'\n  | 'generation'\n  | 'analysis'\n  | 'transformation'\n  | 'integration'\n  | 'custom'\n```\n\n### ImageFormat\n\n```typescript\ntype ImageFormat = 'png' | 'jpeg' | 'gif' | 'webp' | 'bmp'\n```\n\n### AudioFormat\n\n```typescript\ntype AudioFormat = 'mp3' | 'wav' | 'ogg' | 'flac' | 'aac' | 'm4a'\n```\n\n### DocumentFormat\n\n```typescript\ntype DocumentFormat = 'pdf' | 'docx' | 'xlsx' | 'pptx' | 'txt' | 'md' | 'html'\n```\n\n## 变更历史\n\n| 版本 | 日期 | 变更内容 | 作者 |\n| ---- | ---- | -------- | ---- |\n| v1.0.0 | 2026-11-08 | 统一标头标尾 · 品牌规范化为 YYC3 · 标题层级与排版优化 | YYC3 Team |\n\n---"},{"key":"CONTRIBUTING.md","file":"CONTRIBUTING.md","no":"规范","title":"🤝 贡献指南","section":"","dirShort":"","desc":"Claw AI 贡献流程、代码规范与协作约定","range":"","part":"","chars":3484,"minutes":9,"h2":27,"excerpt":"为了营造一个开放和友好的环境，我们作为贡献者和维护者承诺：无论年龄、体型、残疾、种族、性别认同和表达、经验水平、教育程度、社会经济地位、国籍、外貌、种族、宗教或性取向如何，参与我们的项目和社区都将为每个人提供无骚扰的体验。","content":"---\n\n> **欢迎为 YYC3 Claw AI 做出贡献！**\n\n---\n\n## 📋 目录\n\n- [行为准则](#行为准则)\n- [如何贡献](#如何贡献)\n- [开发设置](#开发设置)\n- [提交规范](#提交规范)\n- [Pull Request 流程](#pull-request-流程)\n- [代码审查标准](#代码审查标准)\n- [社区支持](#社区支持)\n\n---\n\n## 行为准则\n\n### 我们的承诺\n\n为了营造一个开放和友好的环境，我们作为贡献者和维护者承诺：无论年龄、体型、残疾、种族、性别认同和表达、经验水平、教育程度、社会经济地位、国籍、外貌、种族、宗教或性取向如何，参与我们的项目和社区都将为每个人提供无骚扰的体验。\n\n### 我们的标准\n\n**积极行为示例：**\n\n- 使用友好和包容的语言\n- 尊重不同的观点和经验\n- 优雅地接受建设性批评\n- 关注对社区最有利的事情\n- 对其他社区成员表示同理心\n\n**不可接受的行为示例：**\n\n- 使用性化的语言或图像，以及不受欢迎的性关注或性骚扰\n- 捣乱、侮辱/贬损评论以及人身或政治攻击\n- 公开或私下骚扰\n- 未经明确许可，发布他人的私人信息\n- 其他在专业环境中可能被合理认为不适当的行为\n\n---\n\n## 如何贡献\n\n### 报告 Bug\n\n如果您发现了 bug，请创建一个 [Issue](https://github.com/YYC-Cube/yyc3-claw/issues) 并包含：\n\n1. **清晰的标题**：简洁描述问题\n2. **复现步骤**：详细的复现步骤\n3. **预期行为**：您期望发生什么\n4. **实际行为**：实际发生了什么\n5. **环境信息**：\n   - 操作系统\n   - Node.js 版本\n   - 项目版本\n6. **截图**：如果适用，添加截图帮助解释问题\n\n**Bug 报告模板：**\n\n```markdown\n## Bug 描述\n[清晰简洁地描述 bug]\n\n## 复现步骤\n1. 执行 '...'\n2. 点击 '....'\n3. 滚动到 '....'\n4. 看到错误\n\n## 预期行为\n[描述您期望发生的情况]\n\n## 实际行为\n[描述实际发生的情况]\n\n## 截图\n[如果适用，添加截图]\n\n## 环境信息\n- 操作系统: [例如 macOS 14.0]\n- Node.js 版本: [例如 18.0.0]\n- 项目版本: [例如 1.0.0]\n\n## 附加信息\n[添加任何其他关于问题的信息]\n```\n\n### 建议新功能\n\n我们欢迎新功能建议！请创建一个 [Issue](https://github.com/YYC-Cube/yyc3-claw/issues) 并包含：\n\n1. **功能描述**：清晰描述您希望添加的功能\n2. **使用场景**：描述这个功能解决什么问题\n3. **建议方案**：如果您有想法，描述可能的实现方式\n4. **替代方案**：描述您考虑过的替代方案\n\n**功能请求模板：**\n\n```markdown\n## 功能描述\n[清晰简洁地描述您希望添加的功能]\n\n## 使用场景\n作为 [用户类型]，我希望 [执行某操作]，以便 [达到某目的]\n\n## 建议方案\n[描述您建议的解决方案]\n\n## 替代方案\n[描述您考虑过的替代解决方案]\n\n## 附加信息\n[添加任何其他关于功能请求的信息]\n```\n\n### 改进文档\n\n文档改进包括：\n\n- 修正拼写或语法错误\n- 添加缺失的文档\n- 改进现有文档的清晰度\n- 翻译文档\n\n---\n\n## 开发设置\n\n### 1. Fork 项目\n\n点击项目页面右上角的 \"Fork\" 按钮。\n\n### 2. 克隆仓库\n\n```bash\ngit clone https://github.com/YOUR_USERNAME/yyc3-claw.git\ncd yyc3-claw\n```\n\n### 3. 添加上游仓库\n\n```bash\ngit remote add upstream https://github.com/YYC-Cube/yyc3-claw.git\n```\n\n### 4. 安装依赖\n\n```bash\npnpm install\n```\n\n### 5. 创建分支\n\n```bash\ngit checkout -b feature/your-feature-name\n```\n\n### 6. 开发\n\n```bash\n# 启动开发模式\npnpm dev\n\n# 运行测试\npnpm test:watch\n\n# 代码检查\npnpm lint\n```\n\n---\n\n## 提交规范\n\n我们使用 [Conventional Commits](https://www.conventionalcommits.org/) 规范。\n\n### 提交格式\n\n```\n\u003ctype>(\u003cscope>): \u003csubject>\n\n\u003cbody>\n\n\u003cfooter>\n```\n\n### Type 类型\n\n| 类型 | 说明 | 示例 |\n|------|------|------|\n| `feat` | 新功能 | `feat: 添加用户认证功能` |\n| `fix` | Bug 修复 | `fix: 修复登录验证错误` |\n| `docs` | 文档更新 | `docs: 更新 API 文档` |\n| `style` | 代码格式（不影响代码运行） | `style: 格式化代码` |\n| `refactor` | 重构（既不是新功能也不是修复 bug） | `refactor: 重构用户服务` |\n| `perf` | 性能优化 | `perf: 优化查询性能` |\n| `test` | 添加测试 | `test: 添加认证模块测试` |\n| `chore` | 构建过程或辅助工具的变动 | `chore: 更新依赖` |\n| `revert` | 回滚 | `revert: 回滚登录功能` |\n\n### Scope 范围（可选）\n\n- `auth` - 认证模块\n- `ai-family` - AI Family 模块\n- `skills` - 技能系统\n- `mcp` - MCP 协议\n- `multimodal` - 多模态处理\n- `core` - 核心模块\n\n### Subject 主题\n\n- 使用祈使语气，现在时态：\"change\" 而不是 \"changed\" 或 \"changes\"\n- 第一个字母小写\n- 结尾不加句号\n\n### 示例\n\n```bash\n# 新功能\ngit commit -m \"feat(auth): 添加 OAuth2.0 认证支持\"\n\n# Bug 修复\ngit commit -m \"fix(ai-family): 修复智能体任务调度问题\"\n\n# 文档更新\ngit commit -m \"docs: 更新开发者指南\"\n\n# 多行提交\ngit commit -m \"feat(skills): 添加代码审查技能\n\n- 实现代码质量分析\n- 添加安全漏洞检测\n- 支持多种编程语言\n\nCloses #123\"\n```\n\n---\n\n## Pull Request 流程\n\n### 1. 确保代码质量\n\n```bash\n# 运行测试\npnpm test\n\n# 类型检查\npnpm typecheck\n\n# 代码检查\npnpm lint\n\n# 构建项目\npnpm build\n```\n\n### 2. 更新分支\n\n```bash\ngit fetch upstream\ngit rebase upstream/main\n```\n\n### 3. 推送分支\n\n```bash\ngit push origin feature/your-feature-name\n```\n\n### 4. 创建 Pull Request\n\n1. 访问您的 fork 页面\n2. 点击 \"New Pull Request\"\n3. 填写 PR 模板\n\n**Pull Request 模板：**\n\n```markdown\n## 变更类型\n- [ ] Bug 修复\n- [ ] 新功能\n- [ ] 重构\n- [ ] 文档更新\n- [ ] 其他\n\n## 变更描述\n[清晰描述您的变更]\n\n## 相关 Issue\nCloses #\n\n## 测试\n- [ ] 已添加测试\n- [ ] 所有测试通过\n\n## 检查清单\n- [ ] 代码遵循项目代码规范\n- [ ] 已进行自我审查\n- [ ] 已更新相关文档\n- [ ] 变更不会产生新的警告\n- [ ] 已添加必要的测试\n- [ ] 所有测试通过\n```\n\n### 5. 等待审查\n\n- 维护者会审查您的 PR\n- 根据反馈进行必要的修改\n- 通过审查后会被合并\n\n---\n\n## 代码审查标准\n\n### 代码质量\n\n- ✅ 代码清晰易读\n- ✅ 遵循项目代码规范\n- ✅ 没有重复代码\n- ✅ 适当的注释\n- ✅ 良好的命名\n\n### 测试覆盖\n\n- ✅ 单元测试覆盖新代码\n- ✅ 边界情况测试\n- ✅ 错误处理测试\n- ✅ 所有测试通过\n\n### 文档\n\n- ✅ 更新相关文档\n- ✅ API 文档更新\n- ✅ README 更新（如需要）\n\n### 性能\n\n- ✅ 没有性能退化\n- ✅ 合理的资源使用\n- ✅ 没有内存泄漏\n\n---\n\n## 社区支持\n\n### 获取帮助\n\n- **GitHub Issues**: [提交问题](https://github.com/yyc/yyc3-claw/issues)\n- **讨论区**: [参与讨论](https://github.com/yyc/yyc3-claw/discussions)\n\n### 参与社区\n\n- 帮助回答问题\n- 审查 Pull Request\n- 分享使用经验\n- 编写教程和文章\n\n---\n\n## 许可证\n\n通过贡献代码，您同意您的贡献将根据项目的 MIT 许可证进行许可。\n\n---\n\n**感谢您的贡献！** 🌹\n\n## 变更历史\n\n| 版本 | 日期 | 变更内容 | 作者 |\n| ---- | ---- | -------- | ---- |\n| v1.0.0 | 2026-11-08 | 统一标头标尾 · 品牌规范化为 YYC3 · 标题层级与排版优化 | YYC3 Team |\n\n---"}]}]};</script>
<script>
(function(){
'use strict';

/* ── 数据装配 ─────────────────────────────────────────── */
var SITE = window.__YYC3_SITE__;
var GROUPS = SITE.groups;
var DOCS = [], MAP = {};
GROUPS.forEach(function(g){
  g.docs.forEach(function(d, i){
    d.gid = g.id; d.groupName = g.name; d.groupColor = g.color; d.groupIcon = g.icon;
    d.idx = i; d.id = g.id + '/' + keyOf(d);
    MAP[d.id] = d; DOCS.push(d);
  });
});
var GROUP_MAP = {};
GROUPS.forEach(function(g){ GROUP_MAP[g.id] = g; });
DOCS.forEach(function(d){
  d.hay = (d.title + ' ' + (d.desc || '') + ' ' + d.content).toLowerCase();
});

var READ_KEY = 'yyc3-hub-read-v1';
var THEME_KEY = 'yyc3-hub-theme';
var LAST_KEY = 'yyc3-hub-last';
var readMap = {};
try { readMap = JSON.parse(localStorage.getItem(READ_KEY)) || {}; } catch(e) { readMap = {}; }

var META = SITE.meta || {};
var $ = function(s){ return document.querySelector(s); };
var view = $('#view'), nav = $('#nav'), sidebar = $('#sidebar'), overlay = $('#overlay');
var state = { view: 'home', gid: null, doc: null, filter: 'all', continuous: false };

/* ── 基础工具 ─────────────────────────────────────────── */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function keyOf(d){ return d.key || d.file; }
function encPath(k){ return String(k).split('/').map(encodeURIComponent).join('/'); }
function pad(n){ return String(n).length < 2 ? '0' + n : String(n); }
function fmtNum(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 1900);
}
function copyText(text){
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function(){ toast('已复制'); })
      .catch(function(){ fallbackCopy(text); });
  }
  fallbackCopy(text);
}
function fallbackCopy(text){
  var ta = document.createElement('textarea'); ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast('已复制'); } catch(e) { toast('复制失败'); }
  document.body.removeChild(ta);
}

/* ── Markdown 渲染（离线轻量解析器） ──────────────────── */
function inline(s){
  var codes = [];
  s = String(s).replace(/`([^`]+)`/g, function(m, c){ codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001'; });
  s = s.replace(/<br\s*\/?>/gi, '\u0002');
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)]*)\)/g, function(m, alt){
    return '<span class="md-img">🖼 ' + (alt || '图片') + '</span>';
  });
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(m, txt, url){
    if (/^https?:\/\//i.test(url)) return '<a href="' + url + '" target="_blank" rel="noopener">' + txt + '</a>';
    return '<span class="md-link" title="' + esc('离线引用：' + url) + '">' + txt + '</span>';
  });
  s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  s = s.replace(/(^|[^_])_([^_\n]+)_/g, '$1<em>$2</em>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/\u0002/g, '<br>');
  s = s.replace(/\u0001(\d+)\u0001/g, function(m, i){ return '<code>' + esc(codes[+i]) + '</code>'; });
  return s;
}

function codeBlock(lang, code){
  return '<div class="code-block"><div class="code-hdr"><span class="code-lang">' +
    esc(lang || 'text') + '</span><button class="copy-btn" data-copy="1">📋 复制</button></div>' +
    '<pre><code>' + esc(code) + '</code></pre></div>';
}

function isList(line){ return /^\s*[-*+]\s+/.test(line) || /^\s*\d+[.)]\s+/.test(line); }
function codeScore(items){
  var nonEmpty = 0, hit = 0;
  items.forEach(function(t){
    if (!t.trim()) return;
    nonEmpty++;
    if (/[{}]/.test(t) || /=/.test(t) || /^\s*(#|\/\/)/.test(t) || /;\s*$/.test(t) ||
        /^\s*(resource|variable|provider|module|output|terraform|aws_|import|from|def |class |const |let |var |return)\b/.test(t)) hit++;
  });
  return nonEmpty ? hit / nonEmpty : 0;
}
function isSpecial(line){
  return /^\s*$/.test(line) || /^#{1,6}\s+/.test(line) || /^\s*(```|~~~)/.test(line) ||
         /^\s*>/.test(line) || /^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line) || isList(line);
}

function renderMd(src){
  var lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  var out = [], i = 0, hid = 0;

  while (i < lines.length) {
    var line = lines[i];

    if (/^\s*$/.test(line)) { i++; continue; }

    var fence = line.match(/^\s*(`{3,}|~{3,})\s*([\w+#.\-]*)\s*$/);
    if (fence) {
      var mark = fence[1].slice(0, 3), lang = fence[2], buf = [];
      i++;
      while (i < lines.length && lines[i].trim().indexOf(mark) !== 0) { buf.push(lines[i]); i++; }
      i++;
      out.push(codeBlock(lang, buf.join('\n')));
      continue;
    }

    var h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      var lv = h[1].length;
      out.push('<h' + lv + ' id="mh-' + (hid++) + '">' + inline(h[2]) + '</h' + lv + '>');
      i++; continue;
    }

    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)) { out.push('<hr>'); i++; continue; }

    if (line.indexOf('|') !== -1 && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      var headCells = splitRow(line);
      i += 2;
      var rows = [];
      while (i < lines.length && lines[i].indexOf('|') !== -1 && !/^\s*$/.test(lines[i])) {
        rows.push(splitRow(lines[i])); i++;
      }
      var html = '<div class="table-wrap"><table><thead><tr>';
      headCells.forEach(function(c){ html += '<th>' + inline(c) + '</th>'; });
      html += '</tr></thead><tbody>';
      rows.forEach(function(r){
        html += '<tr>';
        for (var k = 0; k < headCells.length; k++) html += '<td>' + inline(r[k] || '') + '</td>';
        html += '</tr>';
      });
      html += '</tbody></table></div>';
      out.push(html);
      continue;
    }

    if (/^\s*>/.test(line)) {
      var quote = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) {
        quote.push(lines[i].replace(/^\s*>\s?/, '')); i++;
      }
      out.push('<blockquote>' + renderMd(quote.join('\n')) + '</blockquote>');
      continue;
    }

    if (isList(line)) {
      var ordered = /^\s*\d+[.)]\s+/.test(line);
      var re = ordered ? /^\s*\d+[.)]\s+/ : /^\s*[-*+]\s+/;
      var items = [], raws = [];
      while (i < lines.length) {
        if (!re.test(lines[i])) {
          if (/^\s*$/.test(lines[i])) {
            var j = i + 1;
            while (j < lines.length && /^\s*$/.test(lines[j])) j++;
            if (j < lines.length && re.test(lines[j])) { i = j; continue; }
          }
          break;
        }
        var raw = lines[i].replace(re, ''); i++;
        while (i < lines.length && !/^\s*$/.test(lines[i]) && !re.test(lines[i]) && !isSpecial(lines[i])) {
          raw += '\n' + lines[i].trim(); i++;
        }
        raws.push(raw);
        items.push('<li>' + inline(raw.replace(/\n/g, '<br>')) + '</li>');
      }
      if (items.length >= 5 && codeScore(raws) >= 0.5) {
        // Word 转换遗留：编号列表承载的代码片段 → 还原为代码块
        out.push(codeBlock('code', raws.join('\n')));
      } else {
        out.push('<' + (ordered ? 'ol' : 'ul') + '>' + items.join('') + '</' + (ordered ? 'ol' : 'ul') + '>');
      }
      continue;
    }

    var para = [];
    while (i < lines.length && !isSpecial(lines[i])) {
      if (lines[i].indexOf('|') !== -1 && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) break;
      para.push(lines[i]); i++;
    }
    if (para.length) out.push('<p>' + inline(para.join('<br>')) + '</p>');
    else i++;
  }
  return out.join('\n');
}

function splitRow(line){
  var s = line.trim();
  if (s.charAt(0) === '|') s = s.slice(1);
  if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
  return s.split('|').map(function(c){ return c.trim(); });
}

/* ── 章节切分（H2 → 卡片） ────────────────────────────── */
function splitSections(src){
  var lines = String(src).replace(/\r\n?/g, '\n').split('\n');
  var fence = false, secs = [], cur = { title: '', body: [] };
  lines.forEach(function(line){
    if (/^\s*(```|~~~)/.test(line)) fence = !fence;
    if (!fence && /^##\s+/.test(line)) {
      if (cur.title || cur.body.join('\n').trim()) secs.push(cur);
      cur = { title: line.replace(/^##\s+/, '').trim(), body: [] };
    } else {
      cur.body.push(line);
    }
  });
  if (cur.title || cur.body.join('\n').trim()) secs.push(cur);
  return secs.length ? secs : [{ title: '', body: lines }];
}

/* ── 进度 ─────────────────────────────────────────────── */
function isRead(id){ return !!readMap[id]; }
function saveRead(){
  try { localStorage.setItem(READ_KEY, JSON.stringify(readMap)); } catch(e) {}
}
function readCount(){ return DOCS.filter(function(d){ return isRead(d.id); }).length; }
function groupRead(g){ return g.docs.filter(function(d){ return isRead(d.id); }).length; }
function updateProgress(){
  var n = readCount(), total = DOCS.length;
  var pct = total ? Math.round(n / total * 1000) / 10 : 0;
  $('#progressText').textContent = n + ' / ' + total + ' · ' + pct + '%';
  $('#progressFill').style.width = pct + '%';
}
function setRead(id, val){
  if (val) readMap[id] = 1; else delete readMap[id];
  saveRead(); updateProgress();
  document.querySelectorAll('[data-doc-card="' + id.replace(/"/g, '\\"') + '"]').forEach(function(el){
    el.classList.toggle('read', !!val);
  });
  if (state.view === 'doc' && state.gid + '/' + state.doc === id) {
    var btn = $('[data-mark-read]');
    if (btn) btn.innerHTML = val ? '✅ 已读（点击取消）' : '○ 标记已读';
  }
  if (state.view === 'home') renderHome();
  if (state.view === 'group') renderGroup(state.gid);
  updateNav();
}

/* ── 文档详情 ─────────────────────────────────────────── */
function renderDoc(gid, file){
  var d = MAP[gid + '/' + file];

  try { localStorage.setItem(LAST_KEY, d.id); } catch(e) {}

  var g = GROUP_MAP[gid];
  var secs = splitSections(d.content);
  var titled = secs.filter(function(s){ return s.title; });
  var toc = titled.length > 1 ? '<div class="toc">' + titled.map(function(s, i){
      var real = secs.indexOf(s);
      return '<button data-goto-sec="' + real + '">' + esc(s.title.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, '').trim() || ('第 ' + (i + 1) + ' 节')) + '</button>';
    }).join('') + '</div>' : '';

  var body = '';
  if (state.continuous) {
    body = '<section class="sec-card open"><div class="sec-body md">' + renderMd(d.content) + '</div></section>';
  } else {
    body = secs.map(function(s, i){

        '<button class="sec-head" data-sec-toggle="' + i + '">' +

  var pager = '<div class="pager">' +
    (prev ? '<a href="#/d/' + encodeURIComponent(gid) + '/' + encPath(keyOf(prev)) + '"><span>← 上一篇</span><b>' + esc(prev.title) + '</b></a>' : '<span style="flex:1"></span>') +
    (next ? '<a class="next" href="#/d/' + encodeURIComponent(gid) + '/' + encPath(keyOf(next)) + '"><span>下一篇 →</span><b>' + esc(next.title) + '</b></a>' : '<span style="flex:1"></span>') +

  view.innerHTML =
    '<a class="back" href="#/g/' + encodeURIComponent(gid) + '">← 返回 ' + esc(g.name) + '</a>' +
    '<section class="detail-hero" style="--gc:' + g.color + '">' +
      '<div class="dh-top"><div class="dh-ico">' + g.icon + '</div>' +
        '<span class="chip">' + esc(g.name) + '</span>' +
        '<span class="chip">' + esc(d.file) + '</span>' +
        (d.dirShort ? '<span class="chip">' + esc(d.dirShort) + '</span>' : '') + '</div>' +
      '<h1>' + esc(d.title) + '</h1>' +
      '<div class="dh-desc">' + esc(d.excerpt || d.desc) + '</div>' +
      '<div class="dh-meta">' +
        (d.section ? '<span class="chip">' + esc(d.section) + '</span>' : '') +
        (d.range ? '<span class="chip">源行 ' + esc(d.range) + '</span>' : '') +
        (d.part ? '<span class="chip">第 ' + esc(d.part) + ' 部分</span>' : '') +
        '<span class="chip">' + d.chars + ' 字</span>' +
        '<span class="chip">约 ' + d.minutes + ' 分钟</span>' +
        '<span class="chip">' + secs.length + ' 个章节卡片</span>' +
      '</div>' +
      '<div class="dh-actions">' +
        '<button class="act-btn primary" data-mark-read="1">' + (isRead(d.id) ? '✅ 已读（点击取消）' : '○ 标记已读') + '</button>' +
        '<button class="act-btn" data-toggle-continuous="1">' + (state.continuous ? '🗂 卡片分层' : '📖 连续阅读') + '</button>' +

  updateProgress(); updateNav();
}

/* ── 搜索 ─────────────────────────────────────────────── */
function renderSearch(q){
  state.view = 'search';
  var query = q.toLowerCase(), hits = [];
  for (var i = 0; i < DOCS.length && hits.length < 80; i++) {
    var d = DOCS[i], hay = d.hay || (d.title + ' ' + d.desc + ' ' + d.content).toLowerCase();
    var p = hay.indexOf(query);
    if (p !== -1) {
      var raw = d.content, lp = raw.toLowerCase().indexOf(query);
      var start = Math.max(0, lp - 70), snip = raw.slice(start, start + 190).replace(/\s+/g, ' ');
      hits.push({ d: d, snip: snip });
    }
  }
  var list = hits.map(function(h){
    var d = h.d, safe = esc(h.snip), qe = esc(q);
    safe = safe.replace(new RegExp(qe.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), function(m){ return '<mark>' + m + '</mark>'; });
    return '<a class="result" href="#/d/' + encodeURIComponent(d.gid) + '/' + encPath(keyOf(d)) + '">' +
      '<b>' + esc(d.title) + '</b>' +
      '<div class="r-meta">' + esc(d.groupName) + ' · ' + esc(d.dirShort || '') + ' · ' + esc(d.file) + ' · ' + d.chars + ' 字</div>' +
      '<div class="r-snip">…' + safe + '…</div></a>';
  }).join('');

  view.innerHTML = '<div class="search-head"><h1>检索「' + esc(q) + '」</h1>' +
    '<p>命中 ' + hits.length + ' 篇文档' + (hits.length >= 80 ? '（仅显示前 80 条）' : '') + '</p></div>' +
    (hits.length ? list : '<div class="empty"><div class="big">🔍</div><p>未找到匹配内容，试试「五高」「家族」「架构」</p></div>');
  setCrumb('<b>全文检索</b><span class="tb-tag">' + hits.length + ' 命中</span>');
  updateNav();
}

/* ── 路由 ─────────────────────────────────────────────── */
function route(){
  var raw = location.hash.replace(/^#\/?/, '');
  var parts = raw.split('/').map(function(x){ try { return decodeURIComponent(x); } catch(e) { return x; } });
  if (parts[0] === 'd' && parts.length >= 3) renderDoc(parts[1], parts.slice(2).join('/'));
  else if (parts[0] === 'g' && parts[1]) renderGroup(parts[1]);
  else renderHome();
  window.scrollTo(0, 0);
  closeMobile();
}

/* ── 事件绑定 ─────────────────────────────────────────── */
document.addEventListener('click', function(e){
  var t;

  t = e.target.closest('[data-toggle-group]');
  if (t) {
    var gid = t.getAttribute('data-toggle-group');
    var grp = nav.querySelector('.nav-group[data-group="' + gid + '"]');
    if (grp) grp.classList.toggle('open');
    return;
  }

  t = e.target.closest('[data-read-doc]');
  if (t) {
    e.preventDefault(); e.stopPropagation();
    var id = t.getAttribute('data-read-doc');
    setRead(id, !isRead(id));
    return;
  }

  t = e.target.closest('[data-open-doc]');
  if (t) {
    var pair = t.getAttribute('data-open-doc').split('/');
    location.hash = '#/d/' + encodeURIComponent(pair[0]) + '/' + encodeURIComponent(pair.slice(1).join('/'));
    return;
  }

  t = e.target.closest('[data-goto-group]');
  if (t) { location.hash = '#/g/' + encodeURIComponent(t.getAttribute('data-goto-group')); return; }

  t = e.target.closest('[data-filter]');
  if (t) { state.filter = t.getAttribute('data-filter'); renderGroup(state.gid); return; }

  t = e.target.closest('[data-sec-toggle]');
  if (t) { t.parentElement.classList.toggle('open'); return; }

  t = e.target.closest('[data-goto-sec]');
  if (t) {
    var sec = document.getElementById('sec-' + t.getAttribute('data-goto-sec'));
    if (sec) {
      sec.classList.add('open');
      sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    return;
  }

  t = e.target.closest('[data-copy]');
  if (t) {
    var pre = t.closest('.code-block').querySelector('pre');
    copyText(pre ? pre.innerText : '');
    return;
  }

  t = e.target.closest('[data-mark-read]');
  if (t) {
    var did = state.gid + '/' + state.doc;
    setRead(did, !isRead(did));
    return;
  }

  t = e.target.closest('[data-toggle-continuous]');
  if (t) { state.continuous = !state.continuous; renderDoc(state.gid, state.doc); return; }

  t = e.target.closest('[data-copy-link]');
  if (t) { copyText(location.href); return; }

  t = e.target.closest('[data-print]');
  if (t) { window.print(); return; }
});

/* 进度导出 / 导入 / 重置 */
$('#exportBtn').addEventListener('click', function(){
  var blob = new Blob([JSON.stringify({ version: 1, exported: new Date().toISOString(), read: readMap }, null, 2)], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'yyc3-reading-progress.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1200);
  toast('阅读进度已导出');
});
$('#importBtn').addEventListener('click', function(){ $('#importFile').click(); });
$('#importFile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var data = JSON.parse(r.result);
      var obj = data.read || data;
      Object.keys(obj).forEach(function(k){ if (MAP[k] && obj[k]) readMap[k] = 1; });
      saveRead(); updateProgress(); route(); toast('阅读进度已导入');
    } catch(err) { toast('导入失败：文件格式不正确'); }
  };
  r.readAsText(f);
  e.target.value = '';
});
$('#resetBtn').addEventListener('click', function(){
  if (!confirm('确定要重置全部阅读进度吗？此操作不可撤销。')) return;
  readMap = {}; saveRead(); updateProgress(); route(); toast('阅读进度已重置');
});

/* 键盘 */
document.addEventListener('keydown', function(e){
  var tag = (document.activeElement && document.activeElement.tagName) || '';
  var typing = tag === 'INPUT' || tag === 'TEXTAREA';
  if (e.key === '/' && !typing) { e.preventDefault(); $('#searchInput').focus(); return; }
  if (e.key === 'Escape') {
    if (typing) { document.activeElement.blur(); return; }
    if (state.view !== 'home') location.hash = '#/';
  }
});

/* 启动 */
